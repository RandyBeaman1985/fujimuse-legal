name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  policies:
    name: Policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test 'tests/*.test.mjs'
